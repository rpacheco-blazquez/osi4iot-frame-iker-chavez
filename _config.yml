# Configuración de GitHub Pages para renderizado LaTeX
title: "OSI4IoT Frame - Documentación Técnica"
description: "Sistema de gemelo digital con análisis de visión por computadora"

theme: minima

markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

mathjax:
  enable: true
  combo: "tex-mml-chtml"
  tags: "ams"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages
  - docs

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - src/
  - models/
  - data/
  - requirements.txt
  - run_*.py

header_pages:
  - docs/postprocess_README.md
  - docs/gui_README.md
  - docs/mqtt_README.md

url: 
baseurl: "/osi4iot-frame-iker-chavez"

lang: es

timezone: Europe/Madrid